@let s = st();
@switch (s.state) {
    @case ("LOADING") {
        <div>Loading...</div>
    }
    @case ("LOADED") {
        <div class="p-2 pt-4">
            <div class="grid 2xl:grid-cols-6 lg:grid-cols-4 md:grid-cols-3 grid-cols-2 gap-2">
                @for (c of s.data; track c.date) {
                    <app-card [card]="c"></app-card>
                }
            </div>
        </div>
    }
    @case ("ERROR") {
        <div>Error</div>
    }
}
