name: PR
on:
  pull_request: { }

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ui:
    name: UI
    uses: $/.github/workflows/ui.yaml
    permissions:
      contents: read
      id-token: write # OIDC authentication with AWS
    with:
      environment: dev
      upload_ui: false

  ui-check:
    name: UI
    permissions:
      contents: read # 2026-09-23
    uses: ockendenjo/actions/.github/workflows/ui-lint.yml@b0484bc934491a439496a0c92e64820e9b5f7638 # zizmor: ignore[stale-action-refs,ref-version-mismatch]
    with:
      working_dir: src

  validate:
    name: Validate
    uses: $/.github/workflows/validate.yaml

  tf-plan:
    name: Terraform
    permissions:
      id-token: write # OIDC authentication with AWS
      contents: read
    uses: $/.github/workflows/tf-plan.yaml
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      STATE_BUCKET: ${{ secrets.STATE_BUCKET }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
